openapi: 3.1.0
info:
  title: kb-chatbot server
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/chat:
    post:
      operationId: postChat
      security: []
      summary: Answer a question from the uploaded documents
      description: >
        Streams the answer as an AI SDK UI message stream (Server-Sent Events).
        Citations arrive as `data-citation` parts in the same stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  description: AI SDK UIMessage objects, oldest first
                  items:
                    type: object
      responses:
        "200":
          description: UI message stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/login:
    post:
      operationId: login
      security: []
      summary: Log in to the admin
      description: >
        Checks the credentials against `ADMIN_USERNAME` (default `admin`) and
        `ADMIN_PASSWORD`. While `ADMIN_PASSWORD` is unset nobody can log in.
        Sessions live in memory, so restarting the server logs the admin out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`admin_session` cookie (HttpOnly, SameSite=Lax)"
              schema:
                type: string
        "400":
          description: The body is missing a username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents:
    get:
      operationId: listDocuments
      summary: List uploaded documents
      security:
        - adminSession: []
      responses:
        "200":
          description: Documents, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: uploadDocuments
      summary: Upload one or more documents (at most 10 files, 5 MiB each)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The documents that were added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: More than 10 files in one request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: A file is larger than 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
  responses:
    Unauthorized:
      description: Not logged in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DocumentSummary:
      type: object
      required: [id, filename, chunkCount, uploadedAt]
      properties:
        id:
          type: string
        filename:
          type: string
        chunkCount:
          type: integer
          minimum: 0
        uploadedAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
