openapi: 3.1.0
info:
  title: kb-chatbot server
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/chat:
    post:
      operationId: postChat
      security: []
      summary: Answer a question from the uploaded documents
      description: >
        Answers the latest user message from the 6 passages that best match
        it (embedding cosine and BM25, merged by reciprocal rank fusion).
        Streams the answer as an AI SDK UI message stream (Server-Sent Events).
        After the text, each passage the answer marks with `[n]` arrives as a
        `data-citation` part in the same stream, with `data` shaped like
        Citation. Passages the answer doesn't mark are not sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  description: AI SDK UIMessage objects, oldest first
                  items:
                    type: object
      responses:
        "200":
          description: UI message stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: "`messages` is not an array"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/login:
    post:
      operationId: login
      security: []
      summary: Log in to the admin
      description: >
        Checks the credentials against `ADMIN_USERNAME` (default `admin`) and
        `ADMIN_PASSWORD`. While `ADMIN_PASSWORD` is unset nobody can log in
        (503).
        Sessions live in memory, so restarting the server logs the admin out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`admin_session` cookie (HttpOnly, SameSite=Lax)"
              schema:
                type: string
        "400":
          description: The body is missing a username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: "`ADMIN_PASSWORD` is not set, so nobody can log in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents:
    get:
      operationId: listDocuments
      summary: List uploaded documents
      security:
        - adminSession: []
      responses:
        "200":
          description: Documents, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: uploadDocuments
      summary: Upload one or more documents (at most 10 files, 5 MiB each)
      security:
        - adminSession: []
      description: >
        Responds once every file is chunked, embedded, and saved. Markdown is
        split by heading; other formats get 0 chunks for now. All or nothing:
        if embedding or saving fails, none of the files are added.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The documents that were added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: More than 10 files in one request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: A file is larger than 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Embedding or saving failed; none of the files were added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents/{id}/chunks:
    get:
      operationId: listDocumentChunks
      summary: List a document's chunks, in document order
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document's chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChunkSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No document has that id
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
  responses:
    Unauthorized:
      description: Not logged in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Citation:
      type: object
      required: [id, marker, label, text]
      properties:
        id:
          type: string
        marker:
          type: integer
          minimum: 1
          description: The `[n]` the answer marks the passage with
        label:
          type: string
          description: "e.g. `05-projects-and-practice.md › 05 實踐案例 … › C. 移動微型空間計畫`"
        text:
          type: string
          description: The passage's original text
    ChunkSummary:
      type: object
      required: [path, preview, embeddingModel]
      properties:
        path:
          type: array
          description: "[filename, H1, H2, H3]"
          items:
            type: string
        preview:
          type: string
          description: The first 80 characters of the chunk
        embeddingModel:
          type: string
          description: The embedding model id that produced the chunk's vector
    DocumentSummary:
      type: object
      required: [id, filename, chunkCount, uploadedAt]
      properties:
        id:
          type: string
        filename:
          type: string
        chunkCount:
          type: integer
          minimum: 0
        uploadedAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
