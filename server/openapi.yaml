openapi: 3.1.0
info:
  title: MegaWeaving team wiki server
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/chat:
    post:
      operationId: postChat
      security: []
      summary: Answer a question, or propose the facts of an input
      description: >
        The latest user message is either input or a question. A message that
        opens with an instruction to record what follows (e.g.
        「請把以下內容輸入到知識庫：…」, 「記下：…」) is input: it is stored as
        a 來源, its atomic facts are extracted by the extract model, and the
        reply is a short text and a `data-proposal` part whose `data` is the
        pending Proposal. Nothing enters the knowledge base until a member
        confirms the proposal with `POST /api/proposals/{id}/confirm`; no
        reply of the chat writes to it.

        Any other message is a question, answered from the workspace's
        current confirmed facts (vector search) and the uploaded documents'
        passages, merged by cosine similarity (at most 6 in all).
        Passages are the 6 that best match the question (embedding cosine and
        BM25, merged by reciprocal rank fusion).
        When earlier messages are sent, the latest one is first rewritten
        into a standalone question for retrieval, and the answer sees the
        whole conversation. The conversation lives only in the client.
        When the latest message is the only one and contains 它, 那, 這 or
        其, the chat model is asked whether it names its subject, while the
        answer is prepared alongside and held back. If it does not, the
        answer is dropped and the reply is the fixed sentence
        「請問你指的是哪個計畫或主題？」 with no citations; otherwise the
        held answer is streamed as usual.
        Streams the answer as an AI SDK UI message stream (Server-Sent Events).
        After the text, each passage the answer marks with `[n]` arrives as a
        `data-citation` part in the same stream, with `data` shaped like
        Citation. Passages the answer doesn't mark are not sent.
        When no fact or stored chunk is similar enough to the question (best cosine
        similarity below 0.3), or the passages don't answer it, the answer is
        the fixed refusal 「這個問題我無法回答，請來信客服
        support@megaweaving.example。」 with no citations; below the
        similarity threshold the model is not called.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  description: AI SDK UIMessage objects, oldest first
                  maxItems: 50
                  items:
                    type: object
                    required: [role, parts]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant, system]
                      parts:
                        type: array
                        items:
                          type: object
                          required: [type]
                          properties:
                            type:
                              type: string
                            text:
                              type: string
                              description: >
                                At most 2000 characters in a user message,
                                20000 in other messages
      responses:
        "200":
          description: UI message stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: >
            `messages` is missing or malformed, has more than 50 messages, or
            has a text over its length limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/proposals/{id}/confirm:
    post:
      operationId: confirmProposal
      security: []
      summary: Confirm a pending proposal into the knowledge base
      description: >
        The only way facts enter the knowledge base. Each of the proposal's
        facts becomes confirmed, recorded now and confirmed by the caller.
        Of two calls deciding one proposal at once, only the first succeeds.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: The proposal, now `confirmed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          $ref: "#/components/responses/ProposalNotFound"
        "409":
          $ref: "#/components/responses/ProposalDecided"
  /api/proposals/{id}/reject:
    post:
      operationId: rejectProposal
      security: []
      summary: Reject a pending proposal
      description: >
        None of the proposal's facts enter the knowledge base, now or later.
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: The proposal, now `rejected`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          $ref: "#/components/responses/ProposalNotFound"
        "409":
          $ref: "#/components/responses/ProposalDecided"
  /api/login:
    post:
      operationId: login
      security: []
      summary: Log in to the admin
      description: >
        Checks the credentials against `ADMIN_USERNAME` (default `admin`) and
        `ADMIN_PASSWORD`. While `ADMIN_PASSWORD` is unset nobody can log in
        (503).
        Sessions live in memory, so restarting the server logs the admin out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "204":
          description: Logged in
          headers:
            Set-Cookie:
              description: "`admin_session` cookie (HttpOnly, SameSite=Lax)"
              schema:
                type: string
        "400":
          description: The body is missing a username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: "`ADMIN_PASSWORD` is not set, so nobody can log in"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents:
    get:
      operationId: listDocuments
      summary: List uploaded documents
      security:
        - adminSession: []
      responses:
        "200":
          description: Documents, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: uploadDocuments
      summary: Upload one or more documents (at most 10 files, 5 MiB each)
      security:
        - adminSession: []
      description: >
        Responds once every file is chunked, embedded, and saved. Markdown is
        split by heading, PDF by page (a PDF without a text layer gets 0
        chunks), txt by Q/A pair or paragraph; any other format refuses the
        whole request (415). All or nothing:
        if embedding or saving fails, none of the files are added.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: The documents that were added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSummary"
        "400":
          description: More than 10 files in one request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: A file is larger than 5 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: A file is not .md, .pdf, or .txt; none of the files were added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Embedding or saving failed; none of the files were added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/documents/{id}:
    delete:
      operationId: deleteDocument
      summary: Delete a document with its chunks and embeddings
      description: >
        Responds once the removal is saved; answers stop citing the document
        immediately, and it stays deleted across a restart.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No document has that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/documents/{id}/chunks:
    get:
      operationId: listDocumentChunks
      summary: List a document's chunks, in document order
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document's chunks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChunkSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No document has that id
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: admin_session
  parameters:
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProposalNotFound:
      description: No proposal with that id in the caller's workspace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProposalDecided:
      description: The proposal was already confirmed or rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or wrong credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Citation:
      type: object
      required: [id, marker, kind, label, text]
      properties:
        id:
          type: string
          description: The fact's id, or `<document id>:<chunk index>`
        marker:
          type: integer
          minimum: 1
          description: The `[n]` the answer marks it with
        kind:
          type: string
          enum: [fact, passage]
          description: A confirmed fact of the knowledge base, or a document passage
        label:
          type: string
          description: "A fact's is `知識庫 · <valid from, YYYY-MM-DD in Taiwan>`; a passage's e.g. `05-projects-and-practice.md › 05 實踐案例 … › C. 移動微型空間計畫`, `04-founder-hsiao-yu-chih.pdf › 第 2 頁`, `faq.txt › Q: 網站有英文版嗎？`"
        text:
          type: string
          description: The fact, or the passage's original text
        source:
          type: object
          description: A fact's 來源 as it was given; absent for passages
          required: [content, createdAt]
          properties:
            content:
              type: string
            createdAt:
              type: string
              format: date-time
    Proposal:
      type: object
      description: >
        A 提案: changes to the knowledge base waiting for a member. While
        `pending`, its facts are not in the knowledge base.
      required: [id, status, createdBy, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, rejected]
        createdBy:
          type: string
          description: The member who proposed it (`anonymous` until sign-in)
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [id, kind, factId, content]
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
                enum: [add, supersede, obsolete]
                description: 新增, 取代 or 過時; only `add` so far
              factId:
                type: string
                format: uuid
                description: The fact the item adds
              content:
                type: string
    ChunkSummary:
      type: object
      required: [path, preview, embeddingModel]
      properties:
        path:
          type: array
          description: >
            Markdown `[filename, H1, H2, H3]`, PDF `[filename, "第 N 頁"]`, txt
            `[filename, the chunk's opening]`
          items:
            type: string
        preview:
          type: string
          description: The first 80 characters of the chunk
        embeddingModel:
          type: string
          description: The embedding model id that produced the chunk's vector
    DocumentSummary:
      type: object
      required: [id, filename, chunkCount, uploadedAt]
      properties:
        id:
          type: string
        filename:
          type: string
        chunkCount:
          type: integer
          minimum: 0
        uploadedAt:
          type: string
          format: date-time
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
